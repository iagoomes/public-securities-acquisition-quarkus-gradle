openapi: 3.0.3
info:
  title: Public Securities Acquisition API
  description: API for managing public securities acquisition processes.
  version: 1.0.0
  contact:
    name: Iago Gomes
    email: iagoomes@example.com

tags:
  - name: Public Securities
    description: Operations related to public securities acquisition.

paths:
  /api/v1/public-securities:
    post:
      operationId: createPublicSecuritiesAcquisition
      tags:
        - Public Securities
      summary: Create a new public securities acquisition record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSecuritiesAcquisitionRequest'
      responses:
        '201':
          description: Public securities acquisition record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSecuritiesAcquisitionResponse'
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/v1/customers/{customerId}/public-securities:
    get:
      operationId: getCustomerPublicSecurities
      tags:
        - Public Securities
      summary: Retrieve public securities acquisition records for a specific customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{11}$'
          description: CPF of the customer (11 digits)
          example: "12345678901"
      responses:
        '200':
          description: List of public securities acquisition records for the customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSecuritiesAcquisitionResponse'
        '404':
          description: Customer not found
        '500':
          description: Internal server error

components:
  schemas:
    PublicSecuritiesAcquisitionRequest:
        type: object
        required:
          - isin_code
          - quantity
          - unit_price
          - buyer_cpf
        properties:
          isin_code:
            type: string
            pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$'
            description: International Securities Identification Number (12 characters)
            example: "BRSTNEACNOR6"
          issuer_name:
            type: string
            minLength: 1
            maxLength: 255
            description: Name of the issuer
            example: "Tesouro Nacional"
          quantity:
            type: integer
            minimum: 1
            description: Quantity of securities to acquire
            example: 10
          unit_price:
            type: number
            description: Unit price of the security in BRL (Brazilian Real)
            example: 1234.56
          buyer_cpf:
            type: string
            pattern: '^\d{11}$'
            description: CPF of the buyer (11 digits, no formatting)
            example: "12345678901"
    PublicSecuritiesAcquisitionResponse:
        type: object
        properties:
          id:
            type: string
            format: uuid
            description: Unique identifier of the acquisition record
            example: "123e4567-e89b-12d3-a456-426614174000"
          isin_code:
            type: string
            description: International Securities Identification Number
            example: "BRSTNEACNOR6"
          issuer_name:
            type: string
            description: Name of the issuer
            example: "Tesouro Nacional"
          acquisition_date:
            type: string
            format: date
            description: Date of acquisition
            example: "2025-11-06"
          quantity:
            type: integer
            description: Quantity of securities acquired
            example: 10
          unit_price:
            type: number
            description: Unit price of the security in BRL
            example: 1234.56
          total_price:
            type: number
            description: Total price of the acquisition in BRL
            example: 12345.60
          buyer_cpf:
            type: string
            pattern: '^\d{11}$'
            description: CPF of the buyer (11 digits)
            example: "12345678901"
          created_at:
            type: string
            format: date-time
            description: Timestamp of when the record was created
            example: "2025-11-06T10:30:00Z"